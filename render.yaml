services:
  - type: web
    name: business-of-you
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: ANTHROPIC_API_KEY      # Agent Yo (enter in the Render dashboard)
        sync: false
      - key: AGENT_VOICE
        value: warm and wise
      - key: RESEND_API_KEY         # optional: send emails
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: CRM_WEBHOOK_URL        # optional
        sync: false
    # The free plan's filesystem is wiped on every deploy/restart, so the SQLite
    # data (subscribers, inquiries) won't persist. To keep it, switch to a paid
    # plan and uncomment the disk + DB_PATH below.
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    #  - key: DB_PATH
    #    value: /var/data/site.db
